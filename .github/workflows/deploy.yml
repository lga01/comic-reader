name: Deploy Blazor WASM to GitHub Pages

on:
push:
branches:
- main

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-dotnet@v4
    with:
      dotnet-version: '10.0.x'

  - name: Publish
    run: dotnet publish -c Release

  - name: Fix base href
    run: |
      sed -i 's|<base href="/" />|<base href="/comic-reader/" />|g' bin/Release/net10.0/publish/wwwroot/index.html

  - name: Add .nojekyll
    run: touch bin/Release/net10.0/publish/wwwroot/.nojekyll

  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: bin/Release/net10.0/publish/wwwroot
```

deploy:
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}

```
runs-on: ubuntu-latest
needs: build

steps:
  - name: Deploy
    id: deployment
    uses: actions/deploy-pages@v4
```
